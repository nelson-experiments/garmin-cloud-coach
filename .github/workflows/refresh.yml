name: Refresh Garmin coach snapshot

on:
  push:
    branches: [master]
    paths:
      - src/collect.py
      - tests/test_collect.py
      - requirements.txt
      - .github/workflows/refresh.yml
  schedule:
    # Keep three six-hourly daytime refreshes. The collector refuses to replace
    # the last valid snapshot until Garmin has completed the current night's
    # Sydney sleep record.
    - cron: '17 0,6,12 * * *'
    # One of these runs lands at 08:25 Sydney time all year. The second gives
    # a same-morning retry across the AEST/AEDT offset change.
    - cron: '25 21,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garmin-snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python src/collect.py
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKENS_B64: ${{ secrets.GARMIN_TOKENS_B64 }}
      - run: |
          git config user.name 'garmin-cloud-coach[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json
          git diff --cached --quiet || git commit -m 'Refresh Garmin coaching snapshot'
          git pull --rebase
          git push
