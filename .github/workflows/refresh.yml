name: Refresh Garmin coach snapshot
on:
  schedule:
    # GitHub Actions scheduling is best-effort and only supports UTC.  Refresh
    # every six hours, offset from the top of the hour, so a dropped scheduled
    # run cannot leave the coaching snapshot stale for an entire day.  The
    # 18:17 UTC run is 04:17 AEST / 05:17 AEDT, ahead of the 07:00 Sydney brief.
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python src/collect.py
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKENS_B64: ${{ secrets.GARMIN_TOKENS_B64 }}
      - run: |
          git config user.name 'garmin-cloud-coach[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json
          git diff --cached --quiet || git commit -m 'Refresh Garmin coaching snapshot'
          git push
