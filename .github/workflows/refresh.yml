name: Refresh Garmin coach snapshot

on:
  push:
    branches: [master]
    paths:
      - src/collect.py
      - tests/test_collect.py
      - requirements.txt
      - .github/workflows/refresh.yml
  schedule:
    # Keep three six-hourly daytime refreshes. The collector refuses to replace
    # the last valid snapshot until Garmin has completed the current night's
    # Sydney sleep record.
    - cron: '17 0,6,12 * * *'
    # One run lands at 07:00 Sydney time year-round: 21:00 UTC in AEST and
    # 20:00 UTC in AEDT. The companion run is the seasonal early/late attempt.
    # This gives the 07:30 coaching brief a nominal 30-minute refresh window.
    # The briefing automation also requests and verifies an on-demand refresh.
    - cron: '0 20,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garmin-snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: git pull --rebase
      - run: python src/collect.py
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKENS_B64: ${{ secrets.GARMIN_TOKENS_B64 }}
      - run: |
          git config user.name 'garmin-cloud-coach[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json
          git diff --cached --quiet || git commit -m 'Refresh Garmin coaching snapshot'
          git push
