name: Refresh Garmin coach snapshot
on:
  schedule:
    # GitHub Actions scheduling is best-effort and only supports UTC. Refresh
    # every six hours, offset from the top of the hour, to keep the snapshot
    # fresh through the day.
    - cron: '17 0,6,12,18 * * *'
    # One of these two runs is 07:45 Sydney time year-round; the other is a
    # harmless fallback around daylight-saving transitions. This is late enough
    # for the watch to sync a completed night's sleep after a ~07:00 wake-up.
    - cron: '45 20,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python src/collect.py
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKENS_B64: ${{ secrets.GARMIN_TOKENS_B64 }}
      - run: |
          git config user.name 'garmin-cloud-coach[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json
          git diff --cached --quiet || git commit -m 'Refresh Garmin coaching snapshot'
          git push
